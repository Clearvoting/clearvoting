<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill — ClearVoting</title>
    <link rel="preload" href="/static/fonts/playfair-display-700.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/static/fonts/lora-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/static/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/static/css/site.css?v=1">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <!--strip-->

    <header class="masthead">
        <a href="/" class="logo" aria-label="ClearVoting home">Clear<span>Voting</span></a>
        <p class="masthead-tagline">Facts only · No opinions · No spin</p>
        <nav class="masthead-nav" aria-label="Main">
            <a href="/">Home</a>
            <a href="/#find" id="nav-mine">My representatives</a>
            <a href="/#record" class="nav-wide">The Record</a>
            <a href="/about">About</a>
        </nav>
        <!--edition-->
    </header>

    <main id="main-content" tabindex="-1"><!--content--></main>

    <footer class="site-footer">
        <nav class="footer-links" aria-label="Footer">
            <a href="/about">About</a>
            <a href="/methodology">Methodology &amp; Corrections</a>
            <a href="/privacy">Privacy</a>
            <button type="button" id="feedback-open" class="footer-feedback">Report an error on this page</button>
        </nav>
        <p class="data-line meta">Data from <a href="https://www.congress.gov" target="_blank" rel="noopener">Congress.gov</a> and <a href="https://www.senate.gov" target="_blank" rel="noopener">Senate.gov</a><span id="data-freshness"></span></p>
        <p class="credo">ClearVoting does not express opinions on legislation or representatives.</p>
        <button class="feedback-btn" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Feedback</button>
    </footer>

    <dialog id="feedback-modal" class="feedback-modal" aria-labelledby="feedback-title">
        <div id="feedback-overlay" class="feedback-overlay"></div>
        <form id="feedback-form" class="feedback-form">
            <h2 id="feedback-title">Send feedback</h2>
            <p id="feedback-context" class="meta"></p>
            <label for="feedback-message">What did you see?</label>
            <textarea id="feedback-message" rows="4" required maxlength="2000" autofocus></textarea>
            <div class="feedback-actions"><button type="button" class="btn--secondary" id="feedback-cancel">Cancel</button><button type="submit" class="btn" id="feedback-submit">Send</button></div>
            <p id="feedback-status" role="status"></p>
        </form>
    </dialog>

    <script src="/static/js/site.js?v=1"></script>
    <script src="/static/js/vote.js?v=6"></script>
    <script src="/static/js/bill.js?v=8"></script>
    <script src="/static/js/feedback.js?v=6"></script>
</body>
</html>
