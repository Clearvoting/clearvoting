# CI test gate for ClearVote.
# Render auto-deploys main on push, so this is the only check between a
# broken human commit and production. Bot data pushes (made with the workflow
# token) never trigger it, so ai-sync runs the suite itself before it pushes,
# and weekly-sync before its last two pushes.

name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest -q
