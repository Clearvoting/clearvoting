# Automated weekly government data sync for ClearVote.
# Runs every Saturday at 10:00 UTC (~6 AM ET summer / 5 AM ET winter).
# Pulls members, votes, bills, and campaign finance data from public APIs.
# AI generation is handled separately via local Claude Code /loop on Sundays.
#
# Each step commits its progress independently. All steps use if: always()
# so a timeout in one step doesn't skip remaining steps. Each sync function
# is incremental (skips existing files), so the next run picks up where
# the last one left off.

name: Weekly Government Data Sync

on:
  schedule:
    - cron: '0 10 * * 6'  # Saturday 10:00 UTC
  workflow_dispatch:  # Manual trigger for testing

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
      FEC_API_KEY: ${{ secrets.FEC_API_KEY }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt -r requirements-sync.txt

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync members
        run: python sync.py --step members

      - name: Commit members
        if: always()
        run: |
          git add data/synced/
          git diff --cached --quiet || (git commit -m "data: sync members [automated]" && git push)

      - name: Sync Senate votes
        if: always()
        timeout-minutes: 15
        run: python sync.py --step senate-votes

      - name: Commit Senate votes
        if: always()
        run: |
          git add data/synced/
          git diff --cached --quiet || (git commit -m "data: sync senate votes [automated]" && git push)

      - name: Sync House votes
        if: always()
        timeout-minutes: 25
        run: python sync.py --step house-votes

      - name: Commit House votes
        if: always()
        run: |
          git add data/synced/
          git diff --cached --quiet || (git commit -m "data: sync house votes [automated]" && git push)

      - name: Sync bills
        if: always()
        timeout-minutes: 25
        run: python sync.py --step bills

      - name: Commit bills
        if: always()
        run: |
          git add data/synced/
          git diff --cached --quiet || (git commit -m "data: sync bills [automated]" && git push)

      # Derived index of every roll call (spec §10 #3). Runs after the vote and bill
      # steps so member-vote validation below can check every row resolves in it.
      - name: Build votes index
        if: always()
        timeout-minutes: 5
        run: python sync.py --step votes-index

      - name: Commit votes index
        if: always()
        run: |
          git add data/synced/votes_index.json
          git diff --cached --quiet || (git commit -m "data: rebuild votes index [automated]" && git push)

      - name: Build member voting records
        if: always()
        timeout-minutes: 5
        run: python sync.py --step member-votes

      # Gate: a rebuild that wipes scorecards, loses summaries, or breaks
      # date order must never be committed (July 2026 incidents).
      - name: Validate member voting records
        id: validate_member_votes
        if: always()
        run: python sync.py --step validate

      - name: Commit member votes
        if: always() && steps.validate_member_votes.outcome == 'success'
        run: |
          git add data/synced/
          git diff --cached --quiet || (git commit -m "data: sync member votes [automated]" && git push)

      # Precomputed delegation files (spec §10 #7): need the votes index and the member
      # voting records, so they run after both. Gated like "Commit member votes": when
      # member-vote validation fails, those files are not committed, so overviews built
      # from them must not be committed either (they would no longer match the
      # committed member_votes, and test_committed_overviews_match_the_builder would
      # fail CI on the next PR for a data reason).
      - name: Build state overviews
        if: always() && steps.validate_member_votes.outcome == 'success'
        timeout-minutes: 5
        run: python sync.py --step state-overview

      - name: Commit state overviews
        if: always() && steps.validate_member_votes.outcome == 'success'
        run: |
          git add data/synced/state_overview/
          git diff --cached --quiet || (git commit -m "data: rebuild state overviews [automated]" && git push)

      - name: Write sync metadata
        if: always()
        run: python sync.py --step metadata

      # Final gate: fails the workflow loudly (red run + notification) if any
      # synced data is structurally bad, and blocks the final commit.
      - name: Validate all synced data
        id: validate_all
        if: always()
        run: python sync.py --step validate

      - name: Final commit
        if: always() && steps.validate_all.outcome == 'success'
        run: |
          git add data/synced/
          git diff --cached --quiet || (git commit -m "data: weekly sync complete [automated]" && git push)

      # og Phase B (cut-first, spec §9.3): per-member and per-state share cards from members.json.
      # continue-on-error: a card failure must never turn the data sync red or block its commits.
      - name: Build share cards
        if: always() && steps.validate_all.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/build_og_cards.py --entities

      - name: Commit share cards
        if: always() && steps.validate_all.outcome == 'success'
        run: |
          git add static/og/member static/og/state
          git diff --cached --quiet || (git commit -m "data: rebuild share cards [automated]" && git push)
