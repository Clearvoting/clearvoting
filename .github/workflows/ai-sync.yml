# Automated weekly AI generation sync for ClearVote.
# Runs every Sunday at 10:00 UTC, the day after the government data sync.
# Generates bill summaries, arguments, scorecard verdicts, member narratives,
# and coherence checks via the Anthropic API (sync.py --ai-only).
#
# If the ANTHROPIC_API_KEY secret is not configured, the run exits cleanly
# with a notice instead of failing — the owner can add the secret later.
# Generation is incremental (skips covered bills), so a timeout mid-run is
# fine: the commit step still pushes partial progress and the next run
# picks up where the last one left off.

name: Weekly AI Generation Sync

on:
  schedule:
    - cron: '0 10 * * 0'  # Sunday 10:00 UTC
  workflow_dispatch:  # Manual trigger for testing

permissions:
  contents: write

jobs:
  ai-sync:
    runs-on: ubuntu-latest

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Check for ANTHROPIC_API_KEY
        id: key-check
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY secret is not set — skipping AI generation. Add the secret in repo settings to enable this workflow."
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repo
        if: steps.key-check.outputs.has_key == 'true'
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        if: steps.key-check.outputs.has_key == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.key-check.outputs.has_key == 'true'
        run: pip install -r requirements.txt

      - name: Configure git identity
        if: steps.key-check.outputs.has_key == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run AI generation
        if: steps.key-check.outputs.has_key == 'true'
        timeout-minutes: 350
        run: python sync.py --ai-only

      - name: Commit AI content
        if: always() && steps.key-check.outputs.has_key == 'true'
        run: |
          git add data/synced/
          git diff --cached --quiet || (git commit -m "data: ai sync [automated]" && git push)
